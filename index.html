<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多组表格查看器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- 表格列表视图 -->
         <div class="header">
                <h1 style="font-size: 1.4rem;">配货表格</h1>
        </div>
        <div id="tableListView" class="view">
            
            <div class="actions">
                <button id="importBtn" class="btn btn-import">📥导入数据</button>
            </div>
            <div id="tableList" class="table-list"></div>
        </div>

        <!-- 表格详情视图 -->
        <div id="tableDetailView" class="view hidden">
            <div class="header">
                <button id="backBtn" class="btn btn-back">←</button>
                <span id="currentTableName" class="table-name"></span>
                <button id="toggleViewBtn" class="btn btn-toggle">切换</button>
            </div>

            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr id="tableHeaderRow">
                            <th data-field="index" class="sortable text-right" style="width:6%">序</th>
                            <th data-field="productName" class="text-left" style="width:65%">商品名称</th>
                            <th data-field="barcode" class="text-center toggle-field" style="width:9%">四位</th>
                            <th data-field="quantity" class="text-right" style="width:6%">量</th>
                            <th data-field="price" class="text-center toggle-field" style="width:7%">箱</th>
                            <th data-field="actualQuantity" class="text-right toggle-field" style="width:6%">实</th>
                            <th data-field="productionDate" class="text-center date-field" style="width:22%; display:none;">日期</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div class="table-summary">
                    <div class="summary-row">
                        <span id="tableRowCount">共 0 条数据</span>
                        <span id="tableQuantityTotal">总计：0</span>
                    </div>
                </div>
            </div>

            <div class="legend">
                <span class="legend-item" data-status="all"><span class="color-box all"></span> 全部 <span class="legend-count" id="legendAll">0</span></span>
                <span class="legend-item" data-status="green"><span class="color-box green"></span> 有货 <span class="legend-count" id="legendGreen">0</span></span>
                <span class="legend-item" data-status="red"><span class="color-box red"></span> 无货 <span class="legend-count" id="legendRed">0</span></span>
                <span class="legend-item" data-status="yellow"><span class="color-box yellow"></span> 少货 <span class="legend-count" id="legendYellow">0</span></span>
                <span class="legend-item" data-status="white"><span class="color-box white"></span> 未操作 <span class="legend-count" id="legendWhite">0</span></span>
            </div>
        </div>

    </div>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <h3>编辑数据</h3>
            <div class="product-info">
                <p id="editProductName"></p>
                <p>应发数量: <span id="editQuantity"></span></p>
            </div>
            <input type="number" id="editActualQuantity" placeholder="输入实际数量" min="0">
            <input type="date" id="editProductionDate" placeholder="选择生产日期">
            <div class="modal-actions">
                <button id="cancelEdit" class="btn btn-cancel">取消</button>
                <button id="confirmEdit" class="btn btn-confirm">确认</button>
            </div>
        </div>
    </div>

    <!-- 导入弹窗 -->
    <div id="importModal" class="modal hidden">
        <div class="modal-content" style="max-width: 500px;">
            <h3>导入数据</h3>
            <textarea id="importText" placeholder="粘贴表格数据...
格式：第一行表格名称，第二行表头，后续为数据
示例：
光彩路
序号	商品名称	四位	量	箱
2	津华谷色苦荞片葱香味400g	2725	10	1.0
1	津华谷色苦荞片牛排味400g	0073	20	2.0" rows="12"></textarea>
            <div class="modal-actions">
                <button id="cancelImport" class="btn btn-cancel">取消</button>
                <button id="confirmImport" class="btn btn-confirm">导入</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
